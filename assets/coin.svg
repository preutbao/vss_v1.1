<svg class="vss-coin-svg" viewBox="0 0 360 360" xmlns="http://www.w3.org/2000/svg">
  <style>
    .spin-slow { animation: spinSlow 22s linear infinite; transform-origin: 180px 180px; }
    .spin-reverse { animation: spinReverse 18s linear infinite; transform-origin: 180px 180px; }
    .blink { animation: blink 3.5s ease-in-out infinite; }
    
    @keyframes spinSlow { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    @keyframes spinReverse { from { transform: rotate(0deg); } to { transform: rotate(-360deg); } }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
  </style>

  <defs>
    <filter id="coin-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <radialGradient id="ringGrad" cx="50%" cy="38%" r="50%">
      <stop offset="0%" stop-color="#a8f5c8" stop-opacity="0.9" />
      <stop offset="60%" stop-color="#00c85a" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#006830" stop-opacity="0.5" />
    </radialGradient>
    <radialGradient id="discGrad" cx="42%" cy="35%" r="62%">
      <stop offset="0%" stop-color="#e8fff4" stop-opacity="0.22" />
      <stop offset="55%" stop-color="#00c85a" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#003818" stop-opacity="0.18" />
    </radialGradient>
    <linearGradient id="sweepGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ff88" stop-opacity="0" />
      <stop offset="40%" stop-color="#00ff88" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#00ff88" stop-opacity="0" />
    </linearGradient>
  </defs>

  <circle cx="180" cy="180" r="148" fill="none" stroke="rgba(0,200,100,0.10)" stroke-width="40" />
  <circle cx="180" cy="180" r="155" fill="none" stroke="url(#ringGrad)" stroke-width="2.5" class="spin-slow" />
  <circle cx="180" cy="180" r="145" fill="none" stroke="rgba(0,200,100,0.25)" stroke-width="1" class="spin-reverse" />
  <circle cx="180" cy="180" r="135" fill="none" stroke="rgba(0,200,100,0.12)" stroke-width="0.8" />

  <circle cx="180" cy="180" r="124" fill="url(#discGrad)" stroke="rgba(0,200,100,0.35)" stroke-width="1.5" filter="url(#coin-glow)" />

  <path d="M 100 140 A 95 95 0 0 1 200 90" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="2" stroke-linecap="round" />

  <g filter="url(#coin-glow)">
    <polyline points="108,195 142,155 172,185 210,145 252,165" fill="none" stroke="#00e676" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" class="blink" />
    <polyline points="240,148 252,165 236,170" fill="none" stroke="#00e676" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <g stroke="rgba(0,200,100,0.5)" stroke-width="1.5">
    <line x1="308" y1="180" x2="315" y2="180" />
    <line x1="308" y1="180" x2="315" y2="180" transform="rotate(30 180 180)" />
    <line x1="308" y1="180" x2="315" y2="180" transform="rotate(60 180 180)" />
    <line x1="308" y1="180" x2="315" y2="180" transform="rotate(90 180 180)" />
    <line x1="308" y1="180" x2="315" y2="180" transform="rotate(120 180 180)" />
    <line x1="308" y1="180" x2="315" y2="180" transform="rotate(150 180 180)" />
    <line x1="308" y1="180" x2="315" y2="180" transform="rotate(180 180 180)" />
    <line x1="308" y1="180" x2="315" y2="180" transform="rotate(210 180 180)" />
    <line x1="308" y1="180" x2="315" y2="180" transform="rotate(240 180 180)" />
    <line x1="308" y1="180" x2="315" y2="180" transform="rotate(270 180 180)" />
    <line x1="308" y1="180" x2="315" y2="180" transform="rotate(300 180 180)" />
    <line x1="308" y1="180" x2="315" y2="180" transform="rotate(330 180 180)" />
  </g>
</svg>
