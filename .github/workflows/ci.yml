name: CI - Test & Lint

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov ruff

      - name: Lint with ruff
        run: |
          # E9/F63/F7/F82: lỗi cú pháp/logic nghiêm trọng -> fail build
          ruff check . --select=E9,F63,F7,F82 --output-format=github
          # Phần còn lại: chỉ cảnh báo, không fail build (codebase legacy lớn)
          ruff check . --exit-zero

      - name: Run pytest with coverage
        run: |
          pytest tests/ -v --cov=src --cov-report=term-missing --cov-report=xml
        env:
          FSS_ENV: test

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

      - name: Verify all modules import cleanly (syntax/import smoke test)
        run: |
          python -c "
          import compileall, sys
          ok = compileall.compile_dir('src', quiet=1)
          sys.exit(0 if ok else 1)
          "
